<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayMood — LinkedIn Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #FDF6EC;
    --cream-dark: #F5EBDA;
    --warm-text: #3D3229;
    --warm-muted: #8A7D6B;
    --cta-warm: #D4A86A;

    --joy: #F9E79F;
    --trust: #82E0AA;
    --fear: #76B84E;
    --surprise: #BB8FCE;
    --sadness: #85C1E9;
    --disgust: #D7BDE2;
    --anger: #F1948A;
    --anticipation: #F8B88B;
  }

  body {
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: var(--cream);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Subtle texture overlay ── */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 0% 0%, rgba(133, 193, 233, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(249, 231, 159, 0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(187, 143, 206, 0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Plutchik color bar at top ── */
  .emotion-bar {
    display: flex;
    height: 8px;
    z-index: 1;
    flex-shrink: 0;
  }
  .emotion-bar span { flex: 1; }

  /* ── Header: logo centrado + título debajo ── */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 44px 64px 0;
    z-index: 1;
    flex-shrink: 0;
  }

  .app-icon {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 40px;
    color: var(--warm-text);
    letter-spacing: -0.5px;
    line-height: 1.1;
    text-align: center;
  }

  .header .subtitle {
    font-size: 16px;
    color: var(--warm-muted);
    font-weight: 300;
    letter-spacing: 0.2px;
    text-align: center;
    margin-top: -8px;
  }

  /* ── Main content: phones as hero ── */
  .content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 64px;
    z-index: 1;
    position: relative;
  }

  .phones {
    display: flex;
    gap: 32px;
    justify-content: center;
    align-items: flex-start;
    position: relative;
  }

  .phone-frame {
    width: 280px;
    border-radius: 28px;
    box-shadow:
      0 16px 48px rgba(0,0,0,0.14),
      0 6px 16px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    position: relative;
    z-index: 3;
  }

  .phone-frame:nth-child(2) {
    margin-top: 56px;
  }

  .phone-frame img {
    width: 100%;
    display: block;
  }

  /* ── Footer ── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px 40px;
    z-index: 1;
    flex-shrink: 0;
  }

  .tech-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    background: var(--cream-dark);
    color: var(--warm-muted);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  .cta {
    font-size: 14px;
    color: var(--warm-muted);
    font-weight: 300;
    text-align: right;
    line-height: 1.4;
  }

  .cta strong {
    display: block;
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: var(--warm-text);
    font-weight: 400;
  }

</style>
</head>
<body>

<div class="card">
  <!-- Plutchik color bar -->
  <div class="emotion-bar">
    <span style="background: var(--joy)"></span>
    <span style="background: var(--trust)"></span>
    <span style="background: var(--fear)"></span>
    <span style="background: var(--surprise)"></span>
    <span style="background: var(--sadness)"></span>
    <span style="background: var(--disgust)"></span>
    <span style="background: var(--anger)"></span>
    <span style="background: var(--anticipation)"></span>
  </div>

  <!-- Header: logo centrado + título -->
  <div class="header">
    <img src="/images/daymood-icon.png" alt="DayMood" class="app-icon">
    <h1>DayMood: Diario Emocional con IA</h1>
    <p class="subtitle">Disponible en Android e iOS</p>
  </div>

  <!-- Content: capturas como protagonistas -->
  <div class="content">
    <div class="phones">
      <div class="phone-frame">
        <img src="/images/linkedin-phone-analysis.png" alt="Análisis emocional">
      </div>
      <div class="phone-frame">
        <img src="/images/linkedin-phone-summary.png" alt="Resumen emocional">
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="tech-pills">
      <span class="pill">Kotlin</span>
      <span class="pill">Swift</span>
      <span class="pill">Jetpack Compose</span>
      <span class="pill">SwiftUI</span>
      <span class="pill">Firebase</span>
      <span class="pill">Cifrado E2E</span>
    </div>
    <div class="cta">
      <strong>jaimelxpez.com/projects/daymood</strong>
      Case study t&eacute;cnico completo &rarr;
    </div>
  </div>

</div>

</body>
</html>
